<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Expenses | AutoCare</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span>🚗</span> AutoCare</a><nav>
<a href="dashboard.html">▦ <span>Dashboard</span></a><a href="vehicles.html">🚘 <span>My Vehicles</span></a><a href="service-history.html">🔧 <span>Service History</span></a><a href="reminders.html">⏰ <span>Reminders</span></a><a class="active" href="expenses.html">💰 <span>Expenses</span></a><a href="service-centers.html">📍 <span>Service Centers</span></a><a href="reports.html">📊 <span>Reports</span></a>
</nav><button class="sidebar-logout" id="logoutBtn">↪ Logout</button></aside>
<main class="main-content"><header class="mobile-header"><button id="menuBtn">☰</button><span class="brand">🚗 AutoCare</span></header>
<div class="page-head"><div><span class="eyebrow">FINANCE</span><h1>Expenses</h1><p>Track and understand your vehicle maintenance costs.</p></div><button class="btn btn-primary" id="addExpenseBtn">+ Add Expense</button></div>
<div class="stat-grid"><div class="stat-card"><span class="stat-icon green">₹</span><div><small>Total Expenses</small><strong id="expenseTotal">₹0</strong></div></div><div class="stat-card"><span class="stat-icon blue">📅</span><div><small>This Month</small><strong id="expenseMonth">₹0</strong></div></div></div>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Vehicle</th><th>Category</th><th>Description</th><th>Amount</th><th>Action</th></tr></thead><tbody id="expenseTable"></tbody></table></div></section>
</main></div>
<div class="modal" id="expenseModal"><div class="modal-card"><div class="modal-head"><h2>Add Expense</h2><button class="close" data-close>×</button></div>
<form id="expenseForm"><div class="form-grid"><div><label>Vehicle</label><select id="expenseVehicle" required></select></div><div><label>Date</label><input id="expenseDate" type="date" required></div><div><label>Category</label><select id="expenseCategory"><option>Service</option><option>Repair</option><option>Spare Parts</option><option>Insurance</option><option>Fuel</option><option>Other</option></select></div><div><label>Amount (₹)</label><input id="expenseAmount" type="number" min="0" step="0.01" required></div><div class="full-field"><label>Description</label><input id="expenseDescription" placeholder="e.g. Engine oil and filter"></div></div>
<div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary">Save Expense</button></div></form></div></div>
<script src="js/app.js"></script><script src="js/expenses.js"></script></body></html>
