<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reminders | AutoCare</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span>🚗</span> AutoCare</a><nav>
<a href="dashboard.html">▦ <span>Dashboard</span></a><a href="vehicles.html">🚘 <span>My Vehicles</span></a><a href="service-history.html">🔧 <span>Service History</span></a><a class="active" href="reminders.html">⏰ <span>Reminders</span></a><a href="expenses.html">💰 <span>Expenses</span></a><a href="service-centers.html">📍 <span>Service Centers</span></a><a href="reports.html">📊 <span>Reports</span></a>
</nav><button class="sidebar-logout" id="logoutBtn">↪ Logout</button></aside>
<main class="main-content"><header class="mobile-header"><button id="menuBtn">☰</button><span class="brand">🚗 AutoCare</span></header>
<div class="page-head"><div><span class="eyebrow">ALERTS</span><h1>Maintenance Reminders</h1><p>Never miss an important vehicle date.</p></div><button class="btn btn-primary" id="addReminderBtn">+ Add Reminder</button></div>
<div id="reminderGrid" class="reminder-grid"></div><div id="emptyReminders" class="empty-state hidden"><div>⏰</div><h2>No reminders</h2><p>Create a reminder for upcoming maintenance or documents.</p></div>
</main></div>
<div class="modal" id="reminderModal"><div class="modal-card"><div class="modal-head"><h2>Add Reminder</h2><button class="close" data-close>×</button></div>
<form id="reminderForm"><div class="form-grid"><div><label>Vehicle</label><select id="reminderVehicle" required></select></div><div><label>Reminder Type</label><select id="reminderType"><option>Service</option><option>Oil Change</option><option>Insurance Renewal</option><option>PUC Renewal</option><option>Registration Renewal</option><option>Tyre Check</option><option>Battery Check</option><option>Other</option></select></div><div><label>Due Date</label><input id="reminderDate" type="date" required></div><div class="full-field"><label>Notes</label><input id="reminderNotes" placeholder="e.g. Renew insurance policy"></div></div>
<div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary">Save Reminder</button></div></form></div></div>
<script src="js/app.js"></script><script src="js/reminders.js"></script></body></html>
