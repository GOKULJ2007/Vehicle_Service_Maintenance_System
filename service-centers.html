<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Service Centers | AutoCare</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span>🚗</span> AutoCare</a><nav>
<a href="dashboard.html">▦ <span>Dashboard</span></a><a href="vehicles.html">🚘 <span>My Vehicles</span></a><a href="service-history.html">🔧 <span>Service History</span></a><a href="reminders.html">⏰ <span>Reminders</span></a><a href="expenses.html">💰 <span>Expenses</span></a><a class="active" href="service-centers.html">📍 <span>Service Centers</span></a><a href="reports.html">📊 <span>Reports</span></a>
</nav><button class="sidebar-logout" id="logoutBtn">↪ Logout</button></aside>
<main class="main-content"><header class="mobile-header"><button id="menuBtn">☰</button><span class="brand">🚗 AutoCare</span></header>
<div class="page-head"><div><span class="eyebrow">NETWORK</span><h1>Service Centers</h1><p>Store your trusted workshops and their contact details.</p></div><button class="btn btn-primary" id="addCenterBtn">+ Add Center</button></div>
<div id="centerGrid" class="center-grid"></div><div id="emptyCenters" class="empty-state hidden"><div>📍</div><h2>No service centers</h2><p>Add a trusted service center for quick reference.</p></div>
</main></div>
<div class="modal" id="centerModal"><div class="modal-card"><div class="modal-head"><h2>Add Service Center</h2><button class="close" data-close>×</button></div>
<form id="centerForm"><div class="form-grid"><div><label>Center Name</label><input id="centerName" required placeholder="e.g. ABC Motors"></div><div><label>Phone</label><input id="centerPhone" required placeholder="+91 98765 43210"></div><div><label>Location</label><input id="centerLocation" required placeholder="Chennai"></div><div><label>Specialization</label><input id="centerSpecialization" placeholder="General / Honda / EV"></div><div class="full-field"><label>Notes</label><textarea id="centerNotes" rows="3" placeholder="Additional details"></textarea></div></div>
<div class="modal-actions"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary">Save Center</button></div></form></div></div>
<script src="js/app.js"></script><script src="js/centers.js"></script></body></html>
